<svg width="100%" viewBox="0 0 680 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#FB7185" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="500" fill="#334155">CDN 工作原理</text>
  <text x="340" y="50" text-anchor="middle" font-size="12" fill="#64748B">Content Delivery Network</text>

  <!-- 用户区域 -->
  <rect x="40" y="80" width="100" height="60" rx="8" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.5"/>
  <text x="90" y="108" text-anchor="middle" font-size="13" fill="#3730A3">用户</text>
  <text x="90" y="125" text-anchor="middle" font-size="11" fill="#4F46E5">Browser</text>

  <!-- DNS/负载均衡 -->
  <rect x="220" y="80" width="120" height="60" rx="8" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
  <text x="280" y="108" text-anchor="middle" font-size="13" fill="#065F46">DNS</text>
  <text x="280" y="125" text-anchor="middle" font-size="11" fill="#059669">智能解析</text>

  <!-- 连接线: 用户 -> DNS -->
  <line x1="140" y1="110" x2="220" y2="110" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="100" text-anchor="middle" font-size="10" fill="#64748B">1. 请求域名</text>

  <!-- CDN边缘节点组 -->
  <text x="420" y="75" text-anchor="middle" font-size="11" fill="#64748B">CDN 边缘节点 (PoP)</text>

  <!-- 节点1: 东京 -->
  <rect x="380" y="85" width="80" height="50" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="420" y="107" text-anchor="middle" font-size="11" fill="#334155">东京</text>
  <text x="420" y="122" text-anchor="middle" font-size="10" fill="#94A3B8">Asia</text>

  <!-- 节点2: 洛杉矶 -->
  <rect x="380" y="145" width="80" height="50" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="420" y="167" text-anchor="middle" font-size="11" fill="#334155">洛杉矶</text>
  <text x="420" y="182" text-anchor="middle" font-size="10" fill="#94A3B8">Americas</text>

  <!-- 节点3: 法兰克福 -->
  <rect x="380" y="205" width="80" height="50" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
  <text x="420" y="227" text-anchor="middle" font-size="11" fill="#334155">法兰克福</text>
  <text x="420" y="242" text-anchor="middle" font-size="10" fill="#94A3B8">Europe</text>

  <!-- 连接线: DNS -> 节点 -->
  <line x1="340" y1="110" x2="380" y2="110" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="340" y1="110" x2="380" y2="170" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="340" y1="110" x2="380" y2="230" stroke="#34D399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="360" y="100" text-anchor="middle" font-size="10" fill="#059669">2. 返回最优节点</text>

  <!-- 缓存命中流程 -->
  <rect x="500" y="95" width="140" height="40" rx="6" fill="#ECFDF5" stroke="#34D399" stroke-width="1"/>
  <text x="570" y="116" text-anchor="middle" font-size="12" fill="#065F46">Cache Hit</text>
  <text x="570" y="130" text-anchor="middle" font-size="10" fill="#059669">命中缓存 ✓</text>

  <!-- 缓存未命中流程 -->
  <rect x="500" y="175" width="140" height="40" rx="6" fill="#FFF1F2" stroke="#FB7185" stroke-width="1"/>
  <text x="570" y="196" text-anchor="middle" font-size="12" fill="#9F1239">Cache Miss</text>
  <text x="570" y="210" text-anchor="middle" font-size="10" fill="#E11D48">回源获取 ↓</text>

  <!-- 源站服务器 -->
  <rect x="500" y="270" width="140" height="50" rx="6" fill="#FFFBEB" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="570" y="293" text-anchor="middle" font-size="12" fill="#92400E">源站服务器</text>
  <text x="570" y="310" text-anchor="middle" font-size="10" fill="#D97706">Origin Server</text>

  <!-- 连接线: Miss -> 源站 -->
  <line x1="570" y1="215" x2="570" y2="270" stroke="#FB7185" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="595" y="245" text-anchor="middle" font-size="10" fill="#E11D48">4. 回源请求</text>

  <!-- 缓存存储 -->
  <rect x="500" y="340" width="140" height="40" rx="6" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1"/>
  <text x="570" y="365" text-anchor="middle" font-size="11" fill="#075985">缓存内容</text>
  <text x="570" y="378" text-anchor="middle" font-size="10" fill="#0284C7">存储到边缘节点</text>

  <!-- 连接线: 源站 -> 缓存 -->
  <line x1="570" y1="320" x2="570" y2="340" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="595" y="335" text-anchor="middle" font-size="10" fill="#0284C7">5. 缓存副本</text>

  <!-- 返回用户 -->
  <rect x="220" y="320" width="100" height="50" rx="6" fill="#EEF2FF" stroke="#818CF8" stroke-width="1"/>
  <text x="270" y="343" text-anchor="middle" font-size="11" fill="#3730A3">响应返回</text>
  <text x="270" y="358" text-anchor="middle" font-size="10" fill="#4F46E5">6. 内容送达</text>

  <!-- 连接线: 节点 -> 响应 -->
  <line x1="380" y1="200" x2="320" y2="345" stroke="#818CF8" stroke-width="1.5"/>
  <path d="M320 345 Q300 320 270 345" fill="none" stroke="#818CF8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 分隔线 -->
  <line x1="40" y1="420" x2="640" y2="420" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 关键组件说明 -->
  <text x="40" y="450" font-size="13" font-weight="500" fill="#334155">核心组件</text>

  <circle cx="55" cy="475" r="6" fill="#34D399"/>
  <text x="70" y="479" font-size="11" fill="#64748B">DNS 智能解析</text>
  <text x="180" y="479" font-size="10" fill="#94A3B8">根据用户位置返回最近节点</text>

  <circle cx="320" cy="475" r="6" fill="#818CF8"/>
  <text x="335" y="479" font-size="11" fill="#64748B">边缘节点 (PoP)</text>
  <text x="435" y="479" font-size="10" fill="#94A3B8">全球分布的就近服务器</text>

  <circle cx="55" cy="502" r="6" fill="#FBBF24"/>
  <text x="70" y="506" font-size="11" fill="#64748B">源站服务器</text>
  <text x="175" y="506" font-size="10" fill="#94A3B8">原始内容存储位置</text>

  <circle cx="320" cy="502" r="6" fill="#38BDF8"/>
  <text x="335" y="506" font-size="11" fill="#64748B">缓存机制</text>
  <text x="415" y="506" font-size="10" fill="#94A3B8">TTL 过期策略 + 分层存储</text>

</svg>